name: PWA build and tests

on:
  push:
    paths:
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/pwa-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/pwa-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Bundle verified original ZSL workbook
        working-directory: .
        run: node web/scripts/fetch-zsl-template.mjs
      - name: Audit original financial formulas
        working-directory: .
        run: node web/scripts/audit-formulas.mjs
      - name: Verify real published workbook works with Excel writer
        working-directory: .
        run: node web/scripts/verify-bundled-template.mjs
      - name: Build PWA
        run: npm run build
      - name: Verify original template is in website output
        run: test -s dist/ZSL-Cestovny-prikaz.xlsx
